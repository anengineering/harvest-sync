[project]
name = "harvest-sync"
version = "0.1.1"
description = "One-way sync of time entries from your Harvest account to a client's Harvest account"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tzdata>=2024.1",
]

[project.scripts]
harvest-sync = "harvest_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
